<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estación centinela · simulador</title>
<meta name="theme-color" content="#0b231e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://framework-gb.cdn.gob.mx" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="estilos.css?v=14">
</head>
<body>
<header class="cabecera navbar-gob">
  <img src="https://framework-gb.cdn.gob.mx/landing/img/logoheader.svg" alt="Gobierno de México" class="navbar-logo">
  <span class="navbar-divisor" aria-hidden="true"></span>
  <h1 id="titulo">Estación centinela</h1>
  <select id="selEstacion" aria-label="Estación"></select>
  <select id="selVel" aria-label="Velocidad de la simulación"></select>
  <span class="reloj"><span id="relojFecha"></span> <b id="relojHora"></b></span>
  <button id="btnPausa" class="boton">Pausar</button>
</header>

<div id="aviso" class="aviso" hidden></div>

<div class="probar">
  <button class="boton ev" data-ev="descarga_industrial">Descarga industrial</button>
  <button class="boton ev" data-ev="descarga_organica">Descarga orgánica</button>
  <button class="boton ev" data-ev="lluvia">Lluvia</button>
  <button class="boton ev" data-ev="tormenta" hidden>Tormenta</button>
  <button class="boton ev" data-ev="lluvia_prolongada" hidden>Lluvia prolongada</button>
  <button class="boton ev" data-ev="deslave" hidden>Deslave</button>
  <button class="boton" id="btnCorte">Cortar enlace</button>
</div>

<main class="pagina">
  <div class="escena3d" id="escena3d">
    <canvas id="lienzo3d" role="img" aria-label="Corte del río con la estación en la orilla: cinco sondas en el agua dentro de un tubo de protección, cable al gabinete con el controlador, la tarjeta SD, el módem y las baterías, panel solar y antena en el mástil, la torre celular al fondo, y en la otra orilla el colector de residuos: una barrera flotante en diagonal, una banda y un contenedor con báscula."></canvas>
    <div class="rotulos3d" id="rotulos3d" aria-hidden="true"></div>
  </div>

  <section class="recepcion">
    <p class="alarma-linea" id="alarmaLinea" hidden></p>
    <div class="rec-param" id="recParam"></div>
    <svg id="recepcion" viewBox="0 0 800 180" role="img" aria-label="Mediciones de las últimas 12 horas: puntos llenos recibidos por la plataforma, puntos vacíos guardados en la estación por enviar; la franja es el rango habitual del sitio"></svg>
  </section>
</main>

<script src="https://unpkg.com/three@0.149.0/build/three.min.js" crossorigin=""></script>
<script src="modelo.js?v=12"></script>
<script src="firmware.js?v=6"></script>
<script src="recolector.js?v=1"></script>
<script src="montaje.js?v=10"></script>
<script src="escena.js?v=63"></script>
<script src="recepcion.js?v=7"></script>
<script src="ui.js?v=18"></script>
</body>
</html>
